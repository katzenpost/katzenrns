name: interop
# A katzenrns shell on a Reticulum mesh and a Katzenpost mixnet client in one group, through
# the bridge replica, on a docker mixnet. Two mixnet clients: pigeonhole_protocols' katzenqt1,
# and katzenqt itself through its headless driver.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      no_mixdecoy: true
      no_decoy: true
      epoch_duration: 2m
      no_metrics: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: katzenpost/katzenpost
          ref: reticulum-bridge
          path: katzenpost
      - uses: actions/checkout@v4
        with:
          repository: katzenpost/pigeonhole_rns
          ref: bridge-script-and-box-vectors # main, once pigeonhole_rns PR #1 merges
          path: pigeonhole_rns
      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.26"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure podman socket
        run: systemctl --user start podman.socket || true
      - name: Build and start the mixnet, with a bridge replica
        run: cd katzenpost/docker && make start wait
      - name: Start the mesh replica bridged to replica1
        run: pigeonhole_rns/tests/docker_bridge.sh start katzenpost/docker/mixnet-alpine
      - name: Install katzenrns and the Go mixnet client
        run: |
          sudo apt-get update && sudo apt-get install -y gcc libegl1 libgl1
          pip install -e .
          GOPROXY=direct go install github.com/katzenpost/pigeonhole_protocols/cmd/katzenqt1@main
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: katzenrns founds, katzenqt1 joins
        run: scripts/interop.sh host "$PWD/katzenpost" "$RUNNER_TEMP/host"
      - name: katzenqt1 founds, katzenrns joins
        run: scripts/interop.sh guest "$PWD/katzenpost" "$RUNNER_TEMP/guest"
      - name: Logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/*/*.out "$RUNNER_TEMP"/*/*.err; do [ -f "$f" ] && { echo "--- $f"; tail -40 "$f"; }; done; true
          pigeonhole_rns/tests/docker_bridge.sh logs katzenpost/docker/mixnet-alpine | tail -60 || true
      - name: Stop the mixnet
        if: always()
        run: |
          pigeonhole_rns/tests/docker_bridge.sh stop katzenpost/docker/mixnet-alpine || true
          cd katzenpost/docker && make stop || true
  katzenqt:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      no_mixdecoy: true
      no_decoy: true
      epoch_duration: 2m
      no_metrics: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: katzenpost/katzenpost
          ref: reticulum-bridge
          path: katzenpost
      - uses: actions/checkout@v4
        with:
          repository: katzenpost/pigeonhole_rns
          ref: bridge-script-and-box-vectors # main, once pigeonhole_rns PR #1 merges
          path: pigeonhole_rns
      - uses: actions/checkout@v4
        with:
          repository: katzenpost/katzenqt
          ref: groupchat-model-fixes
          path: katzenqt
      - uses: actions/setup-go@v5
        with:
          go-version: ">=1.26"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Configure podman socket
        run: systemctl --user start podman.socket || true
      - name: Build and start the mixnet, with a bridge replica
        run: cd katzenpost/docker && make start wait
      - name: Start the mesh replica bridged to replica1
        run: pigeonhole_rns/tests/docker_bridge.sh start katzenpost/docker/mixnet-alpine
      - name: Install katzenrns and katzenqt
        run: |
          sudo apt-get update && sudo apt-get install -y gcc libegl1 libgl1 build-essential pkg-config libasound2-dev libxcb-cursor0 libpulse0 libfontconfig1 libxkbcommon0
          pip install -e .
          cd katzenqt && uv sync --all-extras --dev --locked --python 3.12
      - name: katzenrns founds, katzenqt joins
        run: KATZENQT="$PWD/katzenqt/.venv/bin/katzenqt-headless" scripts/interop-katzenqt.sh host "$PWD/katzenpost" "$RUNNER_TEMP/host"
      - name: katzenqt founds, katzenrns joins
        run: KATZENQT="$PWD/katzenqt/.venv/bin/katzenqt-headless" scripts/interop-katzenqt.sh guest "$PWD/katzenpost" "$RUNNER_TEMP/guest"
      - name: Logs
        if: failure()
        run: |
          for f in "$RUNNER_TEMP"/*/*.out "$RUNNER_TEMP"/*/*.err "$RUNNER_TEMP"/*/kqt.log; do [ -f "$f" ] && { echo "--- $f"; tail -40 "$f"; }; done; true
          pigeonhole_rns/tests/docker_bridge.sh logs katzenpost/docker/mixnet-alpine | tail -60 || true
      - name: Stop the mixnet
        if: always()
        run: |
          pigeonhole_rns/tests/docker_bridge.sh stop katzenpost/docker/mixnet-alpine || true
          cd katzenpost/docker && make stop || true
