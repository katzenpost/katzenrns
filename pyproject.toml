[build-system]
requires = ["flit_core >=3.11"]
build-backend = "flit_core.buildapi"

[project]
name = "katzenrns"
version = "0.0.1"
description = "Group chat over Reticulum with Pigeonhole boxes, interoperable with katzenqt on the Katzenpost mixnet."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "David Stainton" }]
dependencies = [
    "pigeonhole-protocols[reticulum] @ git+https://github.com/katzenpost/pigeonhole_protocols@07c96c5a9dbb76261b23f0444d2f63e3536ba59d#subdirectory=py",
    "pigeonhole-rns @ git+https://github.com/katzenpost/pigeonhole_rns@main",
    "rns>=1.0",
    "hpqc @ git+https://github.com/katzenpost/hpqc@62a4e238dbf41f1963d2567a90c48f7fb2507f8e#subdirectory=py",
    "PySide6>=6.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
katzenrns = "katzenrns.__main__:main"

[tool.flit.module]
name = "katzenrns"

[tool.pytest.ini_options]
testpaths = ["tests"]
