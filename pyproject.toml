[build-system]
requires = ["flit_core >=3.11"]
build-backend = "flit_core.buildapi"

[project]
name = "katzenrns"
version = "0.1.0"
description = "Group chat over Reticulum with Pigeonhole boxes, interoperable with katzenqt on the Katzenpost mixnet."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "David Stainton" }]
dependencies = [
    "pigeonhole-protocols[reticulum] @ git+https://github.com/katzenpost/pigeonhole_protocols@91680fc33c6a8073d441b774f94bdcee927b45ce#subdirectory=py",
    "pigeonhole-rns @ git+https://github.com/katzenpost/pigeonhole_rns@main",
    "rns>=1.0",
    "hpqc @ git+https://github.com/katzenpost/hpqc@4732d7fb7e6328407f69a5cea0dfb5e9eca308f7#subdirectory=py",
    "PySide6>=6.7",
    "qrcodegen~=1.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
katzenrns = "katzenrns.__main__:main"

[tool.flit.module]
name = "katzenrns"

[tool.pytest.ini_options]
testpaths = ["tests"]
